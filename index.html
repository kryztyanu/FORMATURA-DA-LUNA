<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FORMATURA DA LUNA - Rifa Eletrônica Kit Churrasco</title>
    <meta name="description" content="Concorra a um KIT CHURRASCO na rifa eletrônica da Formatura da Luna! Escolha seus números da sorte de 00 a 99." />
    <meta property="og:title" content="FORMATURA DA LUNA - Rifa Eletrônica Kit Churrasco" />
    <meta property="og:description" content="Concorra a um KIT CHURRASCO na rifa eletrônica da Formatura da Luna! Sorteio 29/11/2026." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
    <link rel="preload" as="audio" href="/assets/aistudio/Curious_Little_Motion_39a99830.mp3" type="audio/mpeg">
  </head>
  <body class="bg-amber-50/40 text-slate-900 font-sans antialiased selection:bg-emerald-200 selection:text-emerald-900">
    <div id="root"></div>

    <!-- Official background soundtrack for Luna's graduation raffle, continuous loop at 30% volume -->
    <audio
      id="luna-soundtrack"
      src="/assets/aistudio/Curious_Little_Motion_39a99830.mp3"
      autoplay
      preload="auto"
      playsinline
      loop
    >
      <source src="/assets/aistudio/Curious_Little_Motion_39a99830.mp3" type="audio/mpeg" />
      <source src="/assets/aistudio/Curious_Little_Motion.mp3" type="audio/mpeg" />
      <source src="/Curious_Little_Motion.mp3" type="audio/mpeg" />
    </audio>

    <script>
      (function() {
        var audio = document.getElementById('luna-soundtrack');
        if (!audio) return;
        audio.volume = 0.3;
        audio.loop = true;

        function attemptPlay() {
          if (!audio) return;
          audio.volume = 0.3;
          var p = audio.play();
          if (p && typeof p.then === 'function') {
            p.then(function() {
              // Playing successfully
            }).catch(function() {
              // Awaiting user gesture per browser policy
            });
          }
        }

        // Try immediately upon script execution
        attemptPlay();
        window.addEventListener('DOMContentLoaded', attemptPlay);
        window.addEventListener('load', attemptPlay);

        // Keep trying periodically for the first few seconds until started
        var attempts = 0;
        var timer = setInterval(function() {
          attempts++;
          if (!audio.paused || attempts > 20) {
            clearInterval(timer);
            return;
          }
          attemptPlay();
        }, 250);

        // Capture every user interaction across the window and document
        var events = ['pointerdown', 'pointerup', 'touchstart', 'touchend', 'click', 'keydown', 'mousedown', 'mouseup'];
        function onGesture() {
          if (audio && audio.paused) {
            attemptPlay();
          }
        }

        events.forEach(function(evt) {
          window.addEventListener(evt, onGesture, { capture: true, passive: true });
          document.addEventListener(evt, onGesture, { capture: true, passive: true });
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
